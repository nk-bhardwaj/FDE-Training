[build-system]
requires = ["hatchling>=1.13.0"]
build-backend = "hatchling.build"

[project]
name = "fde-ai-sprint"
version = "0.1.0"
description = "FDE AI Engineer FastAPI backend"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "FDE AI Engineer" }]
keywords = ["fastapi", "ai", "openai", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openai>=1.40.0,<4.0.0",
    "anthropic>=0.30.0,<3.0.0",
    "groq>=0.30.0,<2.0.0",
]

[project.scripts]
fde-ai = "app.main:main"
dev = "app.cli:dev"
start = "app.cli:start"
lint = "app.cli:lint"
format = "app.cli:format_code"
format-check = "app.cli:format_check"
test = "app.cli:test"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -p no:cacheprovider --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF", "SIM", "RET"]
ignore = ["E501", "B008", "RET505"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
